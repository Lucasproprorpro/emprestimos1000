name: Build APK (debug)

# Roda automaticamente quando você envia código para a branch principal,
# e também pode ser disparado manualmente pelo botão "Run workflow".
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Baixa o código do seu repositório
      - name: Baixar o código
        uses: actions/checkout@v4

      # 2) Java (o build do Android precisa do JDK 17 no Flutter 3.24)
      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) Flutter na versão que o projeto declara (pubspec: >=3.24.0)
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # 4) Gera a pasta android/ (o projeto não a inclui, por design)
      - name: Gerar pasta de plataforma (android/)
        run: flutter create --platforms=android .

      # 5) Injeta as permissões no AndroidManifest recém-gerado
      #    (INTERNET, CAMERA, LOCATION e leitura de arquivo p/ backup)
      - name: Adicionar permissões no AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's{(<application)}{<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    $1}' "$MANIFEST"
          echo "----- AndroidManifest.xml resultante -----"
          cat "$MANIFEST"

      # 6) Baixa as dependências do pubspec
      - name: Baixar dependências
        run: flutter pub get

      # 7) Compila o APK de debug
      - name: Compilar APK de debug
        run: flutter build apk --debug

      # 8) Publica o APK para você baixar na aba do Actions
      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: emprestafacil-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
